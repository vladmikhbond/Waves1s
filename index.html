<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vawes1s</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="container">
        <h1>
            Vawes 1s 
            <span id="time"></span> 
            <span id="info"> </span> 
        </h1>
        <div>
            <input id="params" type="text" value="size=500; margin=200;  k=0.99; loss=0.0" >
            
            <select id="mode" aria-label="Select" required>
                <option value="Inf" >Inf</option>
                <option value="Sto">Sto</option>
                <option value="Osc" selected >Osc</option>
                <option value="Pul" >Pul</option>
                <option value="Del">Del</option>
            </select>

            <input id="oscilParams" type="text" value="amp=1;  q=0.25; vx=0" >

            <button id="runButton">Run</button>

            <input id="is_velo_visible" type="checkbox" title="Is velo visible."/>      
        </div>
        <div>
            Amp <input id="s_range" type="range"  min="0", max="1000" value="100"/>
            Velo <input id="v_range" type="range"  min="0", max="10000" value="1000"/>
        </div>

        <div class="canvas-frame">
            <canvas id="canvas"></canvas>
            <canvas id="canvasBG" ></canvas>
        </div>

    </main>
    <script type="module" src="main.js"></script>
</body>
</html>
