<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vawes1s</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="container">
        <h1>Vawes1s</h1>
        <div>
            k/m: <input id="k_m" value="1." style="width: 100px;">
            loss: <input id="loss" value=".0" style="width: 100px;">
            
            <select id="state" aria-label="Select" required>
                <option value="Inf" >Inf</option>
                <option value="Sto">Sto</option>
                <option value="Osc" >Osc</option>
                <option value="Mon" selected >Mon</option>
                <option value="Del">Del</option>
            </select>

            <input id="oscill_ampl" value="1.0" style="width: 120px;" title="амплитуда">
            <input id="oscill_q" value="0.01" style="width: 120px;" title="хвильове число">

            <button id="resetButton">Reset</button>
            <button id="runButton">Run</button>

            <input type="checkbox" id="is_velo_visible" title="Is velo visible."/>


            <!-- <span id="params"></span> -->
            <span id="time"></span>            
        </div>

        <div class="canvas-frame">
            <canvas id="canvas"></canvas>
            <canvas id="canvasBG" ></canvas>
        </div>

    </main>
    <script type="module" src="dist/main.js"></script>
</body>
</html>
