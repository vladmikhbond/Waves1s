<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vawes1s</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="container">
        <h1>Vawes1s</h1>
        <div>
            k/m: <input id="k_m" value="0.05" style="width: 100px;">
            loss: <input id="l" value="0.0" style="width: 100px;">

            <button id="resetButton">Reset</button>
            <button id="runButton">Run</button>
            <span id="params"></span>
            <span id="time"></span>
            Osc:
            <input id="oscill_ampl" value="0.05" style="width: 80px;" title="амплитуда">
            <input id="oscill_period" value="200" style="width: 80px;" title="період ">
        </div>
        <canvas id="canvas"></canvas>
    </main>
    <script type="module" src="dist/main.js"></script>
</body>
</html>
